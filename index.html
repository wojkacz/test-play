<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1222">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Murdoku — mobilny kreator planszy v18</title>
  <style>
    :root{
      --bg:#0d1222;--panel:#151d31;--panel2:#1d2842;--line:#33415f;
      --text:#f3f6ff;--muted:#a7b2ca;--accent:#8b5cf6;--accent2:#22d3ee;
      --danger:#fb7185;--ok:#34d399;--warning:#fbbf24;--cell:#f8fafc;
      --cellText:#172033;--safeTop:env(safe-area-inset-top,0px);
      --safeBottom:env(safe-area-inset-bottom,0px);--radius:16px;
      --cell-size:82px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
    body{overscroll-behavior:none}
    button,input,textarea,select{font:inherit}
    button{color:inherit}
    [hidden]{display:none!important}

    #bootBlocker{position:fixed;inset:0;z-index:9999;background:#0d1222;color:#fff;display:grid;place-items:center;padding:28px;text-align:center;line-height:1.45}
    #bootBlocker strong{display:block;font-size:20px;margin-bottom:8px}

    .app{width:100%;max-width:100%;min-width:0;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.app>*,.toprow,.mode-switch,.main,.bottom{min-width:0;max-width:100%}
    .topbar{position:sticky;top:0;z-index:30;padding:calc(8px + var(--safeTop)) 10px 8px;background:rgba(13,18,34,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .toprow{display:flex;align-items:center;gap:8px}
    .brand{font-weight:950;letter-spacing:-.04em;font-size:18px;white-space:nowrap}
    .brand b{color:var(--accent2)}
    .title{min-width:0;flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 11px;font-weight:800}
    .icon-btn,.menu-btn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:19px;font-weight:900}
    .controls-toggle{font-size:17px;transition:transform .2s ease}
    .mode-switch,.filterbar,.board-controls{transition:max-height .24s ease,opacity .18s ease,transform .24s ease,padding .24s ease,margin .24s ease,border-width .24s ease;overflow:hidden}
    .mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;background:#090e1b;border:1px solid var(--line);border-radius:13px;padding:4px;max-height:58px}
    .filterbar{max-height:58px}
    .board-controls{max-height:52px}
    .app.controls-collapsed .mode-switch,.app.controls-collapsed .filterbar,.app.controls-collapsed .board-controls{max-height:0;opacity:0;transform:translateY(-8px);padding-top:0;padding-bottom:0;margin-top:0;border-top-width:0;border-bottom-width:0;pointer-events:none}
    .mode-switch button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:900}
    .mode-switch button.active{background:var(--accent);color:#fff}

    .main{min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .filterbar{display:flex;gap:7px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:#11192b}
    .filterbar::-webkit-scrollbar{display:none}
    .filter-chip{flex:none;min-height:36px;white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:12px;font-weight:850;display:flex;align-items:center;gap:5px}
    .filter-chip span{font-size:14px;color:var(--text)}
    .filter-chip.active{border-color:var(--accent);background:rgba(139,92,246,.2);color:#fff}
    .filter-chip.filtered{border-color:var(--warning);background:rgba(251,191,36,.14);color:#fff}
    .filter-chip:not(.active){opacity:.58}
    .board-controls{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:6px 10px;background:#0f1729;border-bottom:1px solid var(--line)}
    .zoom-btn{min-height:34px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 11px;font-size:13px;font-weight:900}
    .zoom-btn.square{width:38px;padding:5px;font-size:18px}
    .status-info{margin:7px 10px 0;padding:8px 8px 8px 10px;border:1px solid rgba(251,191,36,.48);border-radius:11px;background:rgba(251,191,36,.09);color:#fde68a;font-size:12px;line-height:1.35;display:flex;align-items:flex-start;gap:8px}
    .status-info-text{flex:1;min-width:0}
    .status-close{flex:none;width:28px;height:28px;border:0;border-radius:8px;background:rgba(251,191,36,.13);color:#fde68a;font-size:15px;font-weight:950;display:grid;place-items:center}

    .board-wrap{position:relative;flex:1;min-height:0;overflow:auto;padding:10px 10px 18px;display:flex;align-items:flex-start;justify-content:flex-start;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
    .board-shell{position:relative;margin:0 auto;border:2px solid #d8e0ef;border-radius:10px;overflow:hidden;background:#d5dce8;box-shadow:0 16px 36px rgba(0,0,0,.32);flex:none}
    .board{display:grid;grid-template-columns:repeat(var(--cols),var(--cell-size));position:relative;z-index:1}
    .cell{position:relative;width:var(--cell-size);height:var(--cell-size);border:0;border-right:1px solid #8e9bad;border-bottom:1px solid #8e9bad;background:var(--cell);color:var(--cellText);padding:0;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
    .cell.paint-visited{filter:brightness(1.08);box-shadow:inset 0 0 0 3px rgba(34,211,238,.75)}
    .cell.selected{box-shadow:inset 0 0 0 4px var(--accent);z-index:4}
    .cell.conflict{box-shadow:inset 0 0 0 5px var(--danger);z-index:5}
    .cell.blocked{background:repeating-linear-gradient(135deg,#172033 0 8px,#26334a 8px 16px);color:#e7ecf7}
    .cell.auto-blocked:not(.blocked){background:#fff1f3}
    .room-label{position:absolute;z-index:20;display:flex;align-items:center;justify-content:flex-end;padding:3px 7px;border:1px solid rgba(15,23,42,.22);border-radius:10px;background:rgba(255,255,255,.78);box-shadow:0 1px 3px rgba(15,23,42,.10);color:#000;font-size:var(--label-font-size,clamp(6px,calc(var(--cell-size) * .095),16px));line-height:1.08;font-weight:950;text-transform:uppercase;text-align:right;pointer-events:none;overflow:hidden}
    .room-label.one-line{white-space:nowrap;height:calc(var(--label-font-size) * 1.55 + 6px)}
    .room-label.two-lines{white-space:normal;height:calc(var(--label-font-size) * 2.45 + 6px)}
    .objects{position:absolute;inset:3px;display:flex;justify-content:center;align-items:center;gap:0;flex-wrap:wrap;line-height:1;z-index:3;filter:drop-shadow(0 2px 2px rgba(255,255,255,.95)) drop-shadow(0 1px 1px rgba(15,23,42,.22));pointer-events:none}
    .object-badge{display:inline-grid;place-items:center;width:48%;height:48%;min-width:0;min-height:0;font-size:calc(var(--cell-size) * .38);line-height:1}
    .objects.count-1 .object-badge{width:100%;height:100%;font-size:calc(var(--cell-size) * .62)}
    .objects.count-2 .object-badge{width:49%;height:94%;font-size:calc(var(--cell-size) * .47)}
    .objects.count-many .object-badge{font-size:calc(var(--cell-size) * .32)}
    .emoji-icon{display:inline-grid;place-items:center;line-height:1}
    .table-icon{position:relative;display:inline-block;width:1em;height:.78em;vertical-align:middle;filter:drop-shadow(0 1px 1px rgba(15,23,42,.2))}
    .table-icon::before{content:"";position:absolute;left:5%;right:5%;top:7%;height:31%;border:2px solid #5b371d;border-radius:.11em;background:linear-gradient(#b97a46,#8b572f);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
    .table-icon::after{content:"";position:absolute;left:13%;right:13%;top:39%;bottom:4%;background:linear-gradient(90deg,#5b371d 0 14%,transparent 14% 86%,#5b371d 86% 100%)}
    .note-dot{position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 2px white;z-index:8}
    .final-token{position:absolute;inset:10%;z-index:8;border-radius:50%;display:grid;place-items:center;border:3px solid rgba(255,255,255,.95);box-shadow:0 5px 13px rgba(0,0,0,.3);font-size:calc(var(--cell-size) * .33);font-weight:1000;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.3)}
    .final-token.person-match{box-shadow:0 0 0 4px var(--accent2),0 5px 13px rgba(0,0,0,.35)}
    .cell-x{position:absolute;inset:12%;z-index:9;display:grid;place-items:center;font-size:calc(var(--cell-size) * .72);font-weight:1000;line-height:1;color:#dc2447;text-shadow:0 2px 0 rgba(255,255,255,.95),0 -2px 0 rgba(255,255,255,.95),2px 0 0 rgba(255,255,255,.95),-2px 0 0 rgba(255,255,255,.95);pointer-events:none}
    .cell-x.auto{color:#9f1239;opacity:.9}
    .marks{position:absolute;top:4px;left:4px;right:6px;bottom:6px;z-index:7;display:grid;grid-template-columns:repeat(var(--mark-cols),max-content);grid-auto-rows:max-content;grid-auto-flow:row;gap:3px 4px;align-content:start;justify-content:start;pointer-events:none}
    .mark{display:grid;place-items:center;min-width:0;min-height:0;padding:1px 3px;border-radius:4px;font-size:calc(var(--cell-size) * .15);font-weight:1000;line-height:1;overflow:hidden}
    .mark.candidate{background:rgba(255,255,255,.88)}
    .mark.person-match{outline:2px solid currentColor;box-shadow:0 0 0 2px rgba(255,255,255,.95);transform:scale(1.12)}
    .mark.x{color:#dc2447;font-size:calc(var(--cell-size) * .19)}
    .mark.auto{background:rgba(251,113,133,.12);color:#9f1239}
    .cell.person-focus{border:4px solid var(--accent2)!important;z-index:13;box-shadow:0 0 0 1px rgba(255,255,255,.9),0 0 13px rgba(34,211,238,.78)}
    .board.focus-mode .mark.candidate:not(.person-match){opacity:.14;filter:grayscale(1)}
    .board.focus-mode .final-token:not(.person-match){opacity:.3;filter:grayscale(.7) saturate(.45)}
    .board.focus-mode .person-focus .objects{opacity:.72}
    .board-window{position:absolute;z-index:6;pointer-events:none;background:#e9f5ff;border:1px solid #334155;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.7);transform:translate(-50%,-50%)}
    .board-window.horizontal{width:calc(var(--cell-size) * .76);height:8px}
    .board-window.vertical{width:8px;height:calc(var(--cell-size) * .76)}
    .board-window::after{content:"";position:absolute;background:#334155;border-radius:1px;opacity:.8}
    .board-window.horizontal::after{width:1px;top:0;bottom:0;left:50%}
    .board-window.vertical::after{height:1px;left:0;right:0;top:50%}
    .victim-result{margin:0 10px 8px;padding:10px 12px;border-radius:13px;border:1px solid var(--ok);background:rgba(52,211,153,.08);font-size:13px;line-height:1.35}

    .bottom{position:sticky;bottom:0;z-index:35;background:rgba(13,18,34,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safeBottom))}
    .active-strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:3px 2px 9px}
    .active-strip.split-strip{overflow:hidden}
    .active-strip.split-strip .strip-grow{flex:1 1 auto;min-width:0;justify-content:center;white-space:normal;text-align:center}
    .active-strip::-webkit-scrollbar{display:none}
    .person-chip,.object-chip,.room-chip{flex:none;min-height:42px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:850}
    .instruction-chip{flex:1 0 100%;width:100%;justify-content:center}
    .person-chip.active,.object-chip.active,.room-chip.active{outline:2px solid var(--accent);border-color:transparent;background:#24204a}
    .person-chip.focused{outline-color:var(--accent2);background:#123447}
    .person-dot{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:1000;text-shadow:0 1px 2px rgba(0,0,0,.4)}
    .person-count{min-width:24px;height:24px;padding:0 6px;border-radius:999px;display:grid;place-items:center;background:#0b1221;border:1px solid var(--line);font-size:11px;font-weight:950;color:#dbeafe}
    .person-count.zero{border-color:var(--warning);color:#fde68a;background:rgba(251,191,36,.11)}
    .focus-eye{font-size:13px;color:var(--accent2)}
    .tool-row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
    #playTools{grid-template-columns:repeat(4,1fr)}
    .history-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%;margin-top:6px}
    .history-btn{width:100%;min-height:40px;border:1px solid var(--line);background:var(--panel);border-radius:11px;color:var(--text);font-weight:900}
    .history-btn:disabled{opacity:.38}
    .history-panel{margin-top:6px;border:1px solid var(--line);border-radius:12px;background:#0e1526;overflow:hidden}
    .history-panel-toggle{width:100%;min-height:38px;border:0;background:#182137;color:var(--text);padding:7px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:900;text-align:left}
    .history-panel-body{display:grid;gap:8px;padding:8px;max-height:190px;overflow:auto}
    .history-panel.collapsed .history-panel-body{display:none}
    .history-group{display:grid;gap:4px}
    .history-group-title{font-size:10px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.05em}
    .history-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px;align-items:start;padding:6px 7px;border-radius:8px;background:#111a2d;color:#dbe5f8;font-size:11px;line-height:1.28}
    .history-item.redo{background:#17223a;color:#c7d2fe}
    .history-empty{padding:2px 1px;color:var(--muted);font-size:11px}
    .tool{min-width:0;min-height:50px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:5px 2px;color:var(--muted);font-size:10px;font-weight:900;display:grid;place-items:center;line-height:1.05}
    .tool span{display:block;font-size:20px;margin-bottom:2px;color:var(--text)}
    .tool.active{border-color:var(--accent);background:rgba(139,92,246,.2);color:#fff}

    .backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.18s}
    .backdrop.open{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:min(82dvh,760px);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(105%);transition:.22s ease;overflow:hidden;padding-bottom:var(--safeBottom);box-shadow:0 -20px 50px rgba(0,0,0,.38)}
    .sheet.open{transform:translateY(0)}
    .sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
    .sheet-head h2{font-size:17px;margin:0;flex:1}.sheet-body{padding:14px;overflow:auto;max-height:calc(min(82dvh,760px) - 64px);-webkit-overflow-scrolling:touch}
    .drag{width:44px;height:5px;border-radius:99px;background:#52617c;position:absolute;top:6px;left:50%;transform:translateX(-50%)}
    .close{width:40px;height:40px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;font-weight:900}
    .section{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}
    .section h3{margin:0 0 10px;font-size:14px}
    .field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:var(--muted);font-weight:800}
    .field input,.field textarea,.field select{width:100%;min-height:44px;border:1px solid var(--line);background:#0e1526;color:var(--text);border-radius:11px;padding:10px 11px;outline:none}
    .field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
    .field input[readonly]{opacity:.72;background:#182137}
    .preset-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0 2px}
    .preset-row::-webkit-scrollbar{display:none}
    .preset-badge{flex:none;min-height:30px;border:1px solid var(--line);background:#182137;color:var(--text);border-radius:999px;padding:5px 9px;font-size:12px;font-weight:850}
    .preset-badge:active{border-color:var(--accent);background:rgba(139,92,246,.2)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .btn{min-height:44px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 11px;font-weight:850}
    .btn:disabled{opacity:.45}
    .btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{background:#3b1d29;border-color:#713344;color:#ffdbe2}.btn.full{width:100%}
    .list{display:grid;gap:8px}.list-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);background:#0e1526;border-radius:12px;padding:8px}
    .list-row strong{display:block;font-size:13px}.list-row small{color:var(--muted)}
    .list-row .actions{display:flex;gap:5px}.tiny{width:38px;height:38px;border:1px solid var(--line);background:var(--panel2);border-radius:10px}
    .toggle{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.35;margin:9px 0}.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}
    .palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.palette button{min-height:54px;border:1px solid var(--line);background:#0e1526;border-radius:12px;font-size:22px}.palette button.active{outline:2px solid var(--accent)}
    .edge-grid{display:grid;grid-template-areas:"x top x2" "left mid right" "x3 bottom x4";grid-template-columns:1fr 1fr 1fr;gap:7px;max-width:230px;margin:auto}.edge-grid button{min-height:48px;border:1px solid var(--line);background:#0e1526;border-radius:11px;font-weight:900}.edge-grid .top{grid-area:top}.edge-grid .left{grid-area:left}.edge-grid .mid{grid-area:mid;background:var(--cell);color:var(--cellText)}.edge-grid .right{grid-area:right}.edge-grid .bottom{grid-area:bottom}
    .quick-actions{display:grid;gap:8px}.quick-action{width:100%;min-height:46px;border:1px solid var(--line);background:#0e1526;border-radius:12px;padding:10px 12px;text-align:left;font-weight:850}.quick-action strong{display:block}.quick-action small{display:block;margin-top:2px;color:var(--muted);font-weight:650;line-height:1.3}.quick-reason{padding:9px 10px;margin-bottom:10px;border-radius:11px;border:1px solid rgba(251,191,36,.42);background:rgba(251,191,36,.08);color:#fde68a;font-size:12px;line-height:1.4}
    .quick-action.danger{border-color:#713344;background:#3b1d29;color:#ffdbe2}
    .toast{position:fixed;z-index:100;left:12px;right:12px;bottom:calc(92px + var(--safeBottom));padding:11px 13px;border-radius:13px;background:#07101f;border:1px solid #4a5c7e;color:#fff;box-shadow:0 14px 35px rgba(0,0,0,.4);opacity:0;transform:translateY(12px);pointer-events:none;transition:.18s;text-align:center;font-size:13px}.toast.show{opacity:1;transform:none}
    .hint{font-size:12px;color:var(--muted);line-height:1.45}.danger-text{color:#fecdd3}.ok-text{color:#a7f3d0}
    .help-list{padding-left:20px;color:#dbe5f8;font-size:13px;line-height:1.5}.help-list li{margin-bottom:7px}

    @media(min-width:760px){
      .app{max-width:1100px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
      .topbar{padding-top:10px}.board-wrap{padding:20px}.sheet{left:50%;right:auto;width:min(620px,94vw);transform:translate(-50%,105%);border-radius:22px 22px 0 0}.sheet.open{transform:translate(-50%,0)}
    }
    @media print{.topbar,.filterbar,.board-controls,.status-info,.bottom,.victim-result{display:none!important}.app{display:block}.main{overflow:visible}.board-wrap{overflow:visible;padding:0}.board-shell{box-shadow:none;margin:auto}.cell{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>
</head>
<body>
<div id="bootBlocker"><div><strong>Uruchamianie Murdoku…</strong>Jeśli ten ekran nie zniknie po chwili, podgląd blokuje JavaScript. Pobierz plik i otwórz go w Safari.</div></div>

<div class="app" id="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand">MUR<b>DOKU</b></div>
      <input class="title" id="titleInput" value="Moja zagadka" aria-label="Nazwa zagadki">
      <button class="icon-btn controls-toggle" id="controlsToggleBtn" aria-label="Zwiń górne paski" aria-expanded="true">▲</button>
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <div class="mode-switch">
      <button id="buildModeBtn" class="active">🛠 Budowa</button>
      <button id="playModeBtn">🎮 Gra</button>
    </div>
  </header>

  <main class="main">
    <div class="filterbar" id="filterBar" aria-label="Filtry wyświetlania mapy">

  function cancelGesture(){if(!gesture)return;clearTimeout(gesture.readyTimer);clearTimeout(gesture.longTimer);gesture=null}

    }else if(gesture.tool==='x'){

    }
    if(mutate){if(!gesture.changed){const code=getPerson(gesture.personId)?.code||'?';snapshot(gesture.tool==='candidate'?(gesture.target?`Dodano ${code} jako możliwe przeciągnięciem`:`Usunięto możliwość ${code} przeciągnięciem`):(gesture.target?'Wykluczono pola przeciągnięciem':'Usunięto wykluczenia przeciągnięciem'));gesture.changed=true}mutate();gesture.count++;renderBoard()}
  }
  function beginCellGesture(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;const cell=e.target.closest('.cell');if(!cell||pinch)return;cancelGesture();const index=Number(cell.dataset.index),g={pointerId:e.pointerId,startX:e.clientX,startY:e.clientY,startIndex:index,ready:false,moved:false,painting:false,visited:new Set(),changed:false,count:0,tool:state.mode==='play'?state.playTool:null,personId:state.activePersonId,target:null};gesture=g;

  }

  }

    $('#savePerson').onclick=()=>{const name=$('#personName').value.trim();if(!name){toast('Podaj nazwę.');return}change(()=>{if(id){const target=getPerson(id);if(target)Object.assign(target,{name,color:$('#personColor').value})}else{const assignedCode=nextPersonCode();if(!assignedCode)return;const n={id:uid('person'),name,code:assignedCode,color:$('#personColor').value,victim:false},victimIndex=state.people.findIndex(person=>person.victim);state.people.splice(victimIndex<0?state.people.length:victimIndex,0,n);state.activePersonId=n.id}});peopleSheet()};
  }
  function roomsSheet(){openSheet('Pokoje',`<div class="list">${state.rooms.map(r=>`<div class="list-row"><span style="width:34px;height:34px;border-radius:9px;background:${esc(r.color)}"></span><div><strong>${esc(r.name)}</strong><small>Dotknij narzędzia „Pokój”, aby malować pola</small></div><div class="actions"><button class="tiny" data-edit-room="${r.id}">✏️</button><button class="tiny" data-del-room="${r.id}">🗑</button></div></div>`).join('')}</div><button class="btn primary full" id="addRoom" style="margin-top:10px">＋ Dodaj pokój</button>`);$$('[data-edit-room]',el.sheetBody).forEach(b=>b.onclick=()=>roomForm(b.dataset.editRoom));$$('[data-del-room]',el.sheetBody).forEach(b=>b.onclick=()=>{const id=b.dataset.delRoom;change(()=>{state.rooms=state.rooms.filter(r=>r.id!==id);state.cells.forEach(c=>{if(c.roomId===id)c.roomId=null})});roomsSheet()});$('#addRoom').onclick=()=>roomForm(null)}
  function roomForm(id){const r=id?getRoom(id):{name:'',color:nextRoomColor()};openSheet(id?'Edytuj pokój':'Nowy pokój',`<div class="field"><label>Nazwa</label><input id="roomName" value="${esc(r.name)}" placeholder="Np. Salon"><div class="preset-row" aria-label="Standardowe nazwy pokojów">${ROOM_NAME_PRESETS.map(name=>`<button type="button" class="preset-badge" data-room-name="${esc(name)}">${esc(name)}</button>`).join('')}</div></div><div class="field"><label>Kolor pól</label><input id="roomColor" type="color" value="${esc(r.color)}"></div><button class="btn primary full" id="saveRoom">Zapisz</button>`);$$('[data-room-name]',el.sheetBody).forEach(b=>b.onclick=()=>{$('#roomName').value=b.dataset.roomName;$('#roomName').focus()});$('#saveRoom').onclick=()=>{const name=$('#roomName').value.trim();if(!name){toast('Podaj nazwę pokoju.');return}change(()=>{if(id)Object.assign(getRoom(id),{name,color:$('#roomColor').value});else{const n={id:uid('room'),name,color:$('#roomColor').value};state.rooms.push(n);state.activeRoomId=n.id}});roomsSheet()}}
  function objectsSheet(){openSheet('Przedmioty',`<p class="hint"><span class="ok-text">Dozwolone:</span> fotel/krzesło, dywan, łóżko. <span class="danger-text">Niedozwolone:</span> stół, telewizor, roślina, regał i pudło. Okno ustawia się na krawędzi.</p><div class="list">${state.objects.map(o=>`<div class="list-row"><span style="font-size:32px;display:grid;place-items:center;width:40px;height:40px">${objectIcon(o)}</span><div><strong>${esc(o.name)}</strong><small>${o.edge?'Obiekt krawędziowy':o.occupiable?'Może być zajęty':'Nie może być zajęty'}</small></div><div class="actions">${o.builtin?'':`<button class="tiny" data-edit-object="${o.id}">✏️</button><button class="tiny" data-del-object="${o.id}">🗑</button>`}</div></div>`).join('')}</div><button class="btn primary full" id="addObject" style="margin-top:10px">＋ Dodaj własny przedmiot</button>`);$$('[data-edit-object]',el.sheetBody).forEach(b=>b.onclick=()=>objectForm(b.dataset.editObject));$$('[data-del-object]',el.sheetBody).forEach(b=>b.onclick=()=>{const id=b.dataset.delObject;change(()=>{state.objects=state.objects.filter(o=>o.id!==id);state.hiddenObjectIds=state.hiddenObjectIds.filter(x=>x!==id);state.cells.forEach(c=>c.objects=c.objects.filter(x=>x!==id))});objectsSheet()});$('#addObject').onclick=()=>objectForm(null)}
  function objectFilterSheet(){
    const objects=state.objects.filter(o=>!o.edge),hidden=new Set(state.hiddenObjectIds);openSheet('Widoczne obiekty',`<p class="hint">Odznaczone obiekty znikają tylko z widoku planszy. Nadal pozostają na polach i wpływają na reguły gry.</p><div class="section">${objects.map(o=>`<label class="toggle"><input type="checkbox" data-object-visible="${o.id}" ${hidden.has(o.id)?'':'checked'}><span style="display:flex;align-items:center;gap:10px"><span style="font-size:27px;width:34px;display:grid;place-items:center">${objectIcon(o)}</span><strong>${esc(o.name)}</strong></span></label>`).join('')||'<p class="hint">Brak obiektów do filtrowania.</p>'}</div><div class="grid2"><button class="btn" id="showAllObjects">Pokaż wszystkie</button><button class="btn" id="hideAllObjects">Ukryj wszystkie</button></div>`);
    $$('[data-object-visible]',el.sheetBody).forEach(input=>input.onchange=()=>{const ids=new Set(state.hiddenObjectIds),id=input.dataset.objectVisible;input.checked?ids.delete(id):ids.add(id);state.hiddenObjectIds=[...ids];renderFilters();renderBoard();saveSoon()});
    $('#showAllObjects').onclick=()=>{state.hiddenObjectIds=[];renderAll();objectFilterSheet();saveSoon()};$('#hideAllObjects').onclick=()=>{state.hiddenObjectIds=objects.map(o=>o.id);renderAll();objectFilterSheet();saveSoon()};
  }
  function objectForm(id){const o=id?getObj(id):{name:'',symbol:'◆',occupiable:true};openSheet(id?'Edytuj przedmiot':'Nowy przedmiot',`<div class="field"><label>Nazwa</label><input id="objName" value="${esc(o.name)}"></div><div class="field"><label>Emoji lub krótki symbol</label><input id="objSymbol" value="${esc(o.symbol)}" maxlength="4"></div><label class="toggle"><input id="objOcc" type="checkbox" ${o.occupiable?'checked':''}><span>Osoba może zajmować pole z tym przedmiotem</span></label><button class="btn primary full" id="saveObject">Zapisz</button>`);$('#saveObject').onclick=()=>{const name=$('#objName').value.trim(),symbol=$('#objSymbol').value.trim();if(!name||!symbol){toast('Podaj nazwę i symbol.');return}change(()=>{if(id)Object.assign(getObj(id),{name,symbol,occupiable:$('#objOcc').checked});else{const n={id:uid('obj'),name,symbol,occupiable:$('#objOcc').checked,edge:false,builtin:false};state.objects.push(n);state.activeObjectId=n.id}});objectsSheet()}}
  function rulesSheet(){openSheet('Reguły i wskazówki',`<div class="section"><label class="toggle"><input id="autoX" type="checkbox" ${state.rules.autoX?'checked':''}><span>Pokazuj automatyczne X</span></label><label class="toggle"><input id="rowsCols" type="checkbox" ${state.rules.uniqueRowsCols?'checked':''}><span>Każda osoba w innym wierszu i kolumnie</span></label><label class="toggle"><input id="uniquePeople" type="checkbox" ${state.rules.uniquePeople?'checked':''}><span>Każda osoba tylko raz na planszy</span></label><label class="toggle"><input id="equip" type="checkbox" ${state.rules.forbidEquipment?'checked':''}><span>Blokuj stół, TV, roślinę, regał i pudło</span></label></div><div class="field"><label>Opis wskazówek z książki</label><textarea id="clues" placeholder="Przepisz wskazówki…">${esc(state.clues)}</textarea></div><button class="btn primary full" id="saveRules">Zapisz</button>`);$('#saveRules').onclick=()=>{change(()=>{state.rules.autoX=$('#autoX').checked;state.rules.uniqueRowsCols=$('#rowsCols').checked;state.rules.uniquePeople=$('#uniquePeople').checked;state.rules.forbidEquipment=$('#equip').checked;state.clues=$('#clues').value});closeSheet()}}
  function helpSheet(){openSheet('Jak grać na telefonie',`<ol class="help-list"><li>W <strong>Budowie</strong> ustaw rozmiar z menu, dodaj pokoje, osoby i przedmioty.</li><li>Przytrzymaj pole, aby otworzyć szybkie akcje. Przy narzędziu „Pokój” możesz wypełnić stykającą się białą strefę, usunąć cały pokój wraz z przedmiotami albo odblokować całą połączoną strefę „Niedostępne”.</li><li>W <strong>Grze</strong> „Możliwe” wpisuje kod osoby, „Wyklucz” stawia X, a „Finalnie” ustawia osobę.</li><li>W trybie „Możliwe” lub „Wyklucz” przytrzymaj pole chwilę i przeciągnij palec, aby pomalować kilka pól jednym ruchem.</li><li>Dotknij osobę dwa razy, aby włączyć tryb skupienia. Licznik przy osobie pokazuje liczbę nadal dostępnych zaznaczonych pól.</li><li>Automatyczne X możesz przytrzymać lub podejrzeć, aby zobaczyć jego powód.</li><li>Powiększaj planszę przyciskami −/＋ albo gestem szczypania. „Dopasuj” wraca do widoku całej planszy.</li><li>Ofiarę możesz ustawić ręcznie albo przez menu na ostatnim wolnym przecięciu wiersza i kolumny.</li></ol><p class="hint">Projekt zapisuje się lokalnie. Do kopii zapasowej użyj eksportu JSON.</p>`)}

  function placeVictimLast(){
    const victim=state.people.find(p=>p.victim);if(!victim){toast('Brak ofiary.');return}const usedR=new Set(),usedC=new Set();state.cells.forEach((c,i)=>{if(c.final){const p=rc(i);usedR.add(p.r);usedC.add(p.c)}});const freeR=[];for(let r=0;r<state.rows;r++)if(!usedR.has(r))freeR.push(r);const freeC=[];for(let c=0;c<state.cols;c++)if(!usedC.has(c))freeC.push(c);if(freeR.length!==1||freeC.length!==1){toast('Musi pozostać dokładnie jeden wolny wiersz i jedna kolumna.');return}const i=idx(freeR[0],freeC[0]),reason=constraintReason(i,victim.id);if(reason&&state.cells[i].final!==victim.id){toast(reason);return}change(()=>state.cells[i].final=victim.id);closeSheet();toast('Ofiara ustawiona na ostatnim wolnym polu.')
  }
  function exportProject(){
    const data=JSON.stringify(state,null,2),name=(state.title.trim()||'murdoku').replace(/[^a-zA-Z0-9ąćęłńóśźżĄĆĘŁŃÓŚŹŻ_-]+/g,'_')+'.json';
    const url=URL.createObjectURL(new Blob([data],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Zapisano plik JSON.')
  }

  el.board.addEventListener('click',e=>{if(Date.now()<(window.__murdokuSuppressClickUntil||0))return;const b=e.target.closest('.cell');if(b)cellTap(Number(b.dataset.index))});
  el.board.addEventListener('pointerdown',beginCellGesture);
  document.addEventListener('pointermove',moveCellGesture,{passive:false});
  document.addEventListener('pointerup',endCellGesture);
  document.addEventListener('pointercancel',endCellGesture);
  el.boardWrap.addEventListener('touchstart',e=>{if(e.touches.length!==2)return;cancelGesture();const a=e.touches[0],b=e.touches[1];pinch={distance:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),zoom:state.zoom};e.preventDefault()},{passive:false});
  el.boardWrap.addEventListener('touchmove',e=>{if(!pinch||e.touches.length!==2)return;const a=e.touches[0],b=e.touches[1],distance=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);state.zoom=clamp(pinch.zoom*(distance/Math.max(1,pinch.distance)),.65,1.8);e.preventDefault();if(!pinchFrame)pinchFrame=requestAnimationFrame(()=>{pinchFrame=0;fitCellSize();renderBoard()})},{passive:false});
  el.boardWrap.addEventListener('touchend',e=>{if(!pinch||e.touches.length>=2)return;pinch=null;if(pinchFrame){cancelAnimationFrame(pinchFrame);pinchFrame=0}state.zoom=Math.round(state.zoom*100)/100;renderAll();saveSoon()},{passive:false});
  el.controlsToggle.onclick=()=>{state.controlsCollapsed=!state.controlsCollapsed;renderMode();saveSoon()};
  el.historyToggle.onclick=()=>{state.historyCollapsed=!state.historyCollapsed;renderMode();saveSoon()};
  el.zoomOut.onclick=()=>setZoom(state.zoom-.15);el.zoomIn.onclick=()=>setZoom(state.zoom+.15);el.zoomFit.onclick=()=>setZoom(1);
  el.buildMode.onclick=()=>{cancelGesture();state.mode='build';renderAll();saveSoon()};el.playMode.onclick=()=>{cancelGesture();state.mode='play';state.clearMode=false;renderAll();saveSoon()};
  el.buildTools.addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;cancelGesture();state.buildTool=b.dataset.tool;state.clearMode=false;renderAll();saveSoon()});
  el.playTools.addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;cancelGesture();state.playTool=b.dataset.tool;if(state.playTool==='candidate'){const visible=peopleForStrip();if(!visible.some(p=>p.id===state.activePersonId)){state.activePersonId=visible[0]?.id||null;if(state.focusPersonId)state.focusPersonId=state.activePersonId}}renderAll();saveSoon()});
  el.playUndo.onclick=undo;el.playRedo.onclick=redo;
  el.filterBar.addEventListener('click',e=>{const action=e.target.closest('[data-filter-action]');if(action){if(action.dataset.filterAction==='objects')objectFilterSheet();return}const b=e.target.closest('[data-display]');if(!b)return;const key=b.dataset.display;state.display[key]=!state.display[key];renderAll();saveSoon()});
  el.activeStrip.addEventListener('click',e=>{const r=e.target.closest('[data-room]'),o=e.target.closest('[data-object]'),p=e.target.closest('[data-person]'),a=e.target.closest('[data-action]');if(r){state.activeRoomId=r.dataset.room;state.clearMode=false;renderStrip();saveSoon()}else if(o){state.activeObjectId=o.dataset.object;state.clearMode=false;renderStrip();saveSoon()}else if(p){const id=p.dataset.person,now=Date.now(),doubleTap=personTap.id===id&&now-personTap.time<430;state.activePersonId=id;if(doubleTap){state.focusPersonId=state.focusPersonId===id?null:id;personTap={id:null,time:0};toast(state.focusPersonId?`Tryb skupienia: ${getPerson(id)?.name||id}.`:'Tryb skupienia wyłączony.')}else{if(state.focusPersonId)state.focusPersonId=id;personTap={id,time:now}}renderAll();saveSoon()}else if(a){if(a.dataset.action==='clear-mode'){state.clearMode=!state.clearMode;renderAll();saveSoon();toast(state.clearMode?'Tryb czyszczenia: dotknij pola.':'Tryb czyszczenia wyłączony.');return}({rooms:roomsSheet,objects:objectsSheet,people:peopleSheet,setup:setupSheet,cell:()=>state.selected==null?toast('Najpierw wybierz pole.'):openCellSheet(state.selected)})[a.dataset.action]?.()}});
  el.menu.onclick=menuSheet;el.closeSheet.onclick=closeSheet;el.backdrop.onclick=closeSheet;
  el.title.addEventListener('input',e=>{state.title=e.target.value;saveSoon()});
  el.importInput.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);snapshot('Zaimportowano projekt');state=x;normalize();renderAll();saveSoon();closeSheet();toast('Projekt zaimportowany.')}catch(err){toast('Niepoprawny plik projektu.')}};reader.readAsText(f);e.target.value=''});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
  window.addEventListener('resize',()=>renderAll());

  renderAll();saveSoon();requestAnimationFrame(()=>$('#bootBlocker').remove());
})();
</script>
</body>
</html>
