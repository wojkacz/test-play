<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1222">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Murdoku — mobilny kreator planszy</title>
  <style>
    :root{
      --bg:#0d1222;--panel:#151d31;--panel2:#1d2842;--line:#33415f;
      --text:#f3f6ff;--muted:#a7b2ca;--accent:#8b5cf6;--accent2:#22d3ee;
      --danger:#fb7185;--ok:#34d399;--warning:#fbbf24;--cell:#f8fafc;
      --cellText:#172033;--safeTop:env(safe-area-inset-top,0px);
      --safeBottom:env(safe-area-inset-bottom,0px);--radius:16px;
      --cell-size:82px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
    body{overscroll-behavior:none}
    button,input,textarea,select{font:inherit}
    button{color:inherit}
    [hidden]{display:none!important}

    #bootBlocker{position:fixed;inset:0;z-index:9999;background:#0d1222;color:#fff;display:grid;place-items:center;padding:28px;text-align:center;line-height:1.45}
    #bootBlocker strong{display:block;font-size:20px;margin-bottom:8px}

    .app{width:100%;max-width:100%;min-width:0;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.app>*,.toprow,.mode-switch,.main,.bottom{min-width:0;max-width:100%}
    .topbar{position:sticky;top:0;z-index:30;padding:calc(8px + var(--safeTop)) 10px 8px;background:rgba(13,18,34,.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .toprow{display:flex;align-items:center;gap:8px}
    .brand{font-weight:950;letter-spacing:-.04em;font-size:18px;white-space:nowrap}
    .brand b{color:var(--accent2)}
    .title{min-width:0;flex:1;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:10px 11px;font-weight:800}
    .icon-btn,.menu-btn{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;font-size:19px;font-weight:900}
    .mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px;background:#090e1b;border:1px solid var(--line);border-radius:13px;padding:4px}
    .mode-switch button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:900}
    .mode-switch button.active{background:var(--accent);color:#fff}

    .main{min-height:0;display:flex;flex-direction:column;overflow:hidden}
    .statusbar{display:flex;gap:7px;padding:8px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);background:#11192b}
    .statusbar::-webkit-scrollbar{display:none}
    .chip{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 9px;font-size:12px;color:var(--muted);font-weight:800}
    .chip strong{color:var(--text)}
    .chip.bad{border-color:var(--danger);color:#ffd9df}
    .chip.good{border-color:var(--ok);color:#caffeb}

    .board-wrap{position:relative;flex:1;min-height:0;overflow:auto;padding:10px 10px 18px;display:flex;align-items:flex-start;justify-content:flex-start;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
    .board-shell{position:relative;margin:0 auto;border:2px solid #d8e0ef;border-radius:10px;overflow:hidden;background:#d5dce8;box-shadow:0 16px 36px rgba(0,0,0,.32);flex:none}
    .board{display:grid;grid-template-columns:repeat(var(--cols),var(--cell-size));position:relative;z-index:1}
    .cell{position:relative;width:var(--cell-size);height:var(--cell-size);border:0;border-right:1px solid #8e9bad;border-bottom:1px solid #8e9bad;background:var(--cell);color:var(--cellText);padding:0;overflow:hidden;touch-action:manipulation}
    .cell.selected{box-shadow:inset 0 0 0 4px var(--accent);z-index:4}
    .cell.conflict{box-shadow:inset 0 0 0 5px var(--danger);z-index:5}
    .cell.blocked{background:repeating-linear-gradient(135deg,#172033 0 8px,#26334a 8px 16px);color:#e7ecf7}
    .cell.auto-blocked:not(.blocked){background:#fff1f3}
    .room-label{position:absolute;z-index:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:3px 7px;border:1px solid rgba(15,23,42,.22);border-radius:10px;background:rgba(255,255,255,.78);box-shadow:0 1px 3px rgba(15,23,42,.10);color:#000;font-size:var(--label-font-size,clamp(8px,calc(var(--cell-size) * .118),11px));line-height:1.08;font-weight:950;text-transform:uppercase;text-align:right;pointer-events:none;overflow:hidden}
    .room-label.one-line{white-space:nowrap;max-height:1.55em}
    .room-label.two-lines{white-space:normal;max-height:2.45em}
    .objects{position:absolute;inset:3px;display:flex;justify-content:center;align-items:center;gap:0;flex-wrap:wrap;line-height:1;z-index:3;filter:drop-shadow(0 2px 2px rgba(255,255,255,.95)) drop-shadow(0 1px 1px rgba(15,23,42,.22));pointer-events:none}
    .object-badge{display:inline-grid;place-items:center;width:48%;height:48%;min-width:0;min-height:0;font-size:calc(var(--cell-size) * .32);line-height:1}
    .objects.count-1 .object-badge{width:100%;height:100%;font-size:calc(var(--cell-size) * .50)}
    .objects.count-2 .object-badge{width:49%;height:94%;font-size:calc(var(--cell-size) * .39)}
    .objects.count-many .object-badge{font-size:calc(var(--cell-size) * .27)}
    .emoji-icon{display:inline-grid;place-items:center;line-height:1}
    .table-icon{position:relative;display:inline-block;width:1em;height:.78em;vertical-align:middle;filter:drop-shadow(0 1px 1px rgba(15,23,42,.2))}
    .table-icon::before{content:"";position:absolute;left:5%;right:5%;top:7%;height:31%;border:2px solid #5b371d;border-radius:.11em;background:linear-gradient(#b97a46,#8b572f);box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
    .table-icon::after{content:"";position:absolute;left:13%;right:13%;top:39%;bottom:4%;background:linear-gradient(90deg,#5b371d 0 14%,transparent 14% 86%,#5b371d 86% 100%)}
    .blocked-label{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:950;letter-spacing:.03em}
    .note-dot{position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 2px white;z-index:8}
    .final-token{position:absolute;inset:10%;z-index:8;border-radius:50%;display:grid;place-items:center;border:3px solid rgba(255,255,255,.95);box-shadow:0 5px 13px rgba(0,0,0,.3);font-size:calc(var(--cell-size) * .33);font-weight:1000;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.3)}
    .cell-x{position:absolute;inset:12%;z-index:9;display:grid;place-items:center;font-size:calc(var(--cell-size) * .72);font-weight:1000;line-height:1;color:#dc2447;text-shadow:0 2px 0 rgba(255,255,255,.95),0 -2px 0 rgba(255,255,255,.95),2px 0 0 rgba(255,255,255,.95),-2px 0 0 rgba(255,255,255,.95);pointer-events:none}
    .cell-x.auto{color:#9f1239;opacity:.9}
    .marks{position:absolute;top:4px;left:4px;right:6px;bottom:6px;z-index:7;display:grid;grid-template-columns:repeat(var(--mark-cols),max-content);grid-auto-rows:max-content;grid-auto-flow:row;gap:3px 4px;align-content:start;justify-content:start;pointer-events:none}
    .mark{display:grid;place-items:center;min-width:0;min-height:0;padding:1px 3px;border-radius:4px;font-size:calc(var(--cell-size) * .15);font-weight:1000;line-height:1;overflow:hidden}
    .mark.candidate{background:rgba(255,255,255,.88)}
    .mark.x{color:#dc2447;font-size:calc(var(--cell-size) * .19)}
    .mark.auto{background:rgba(251,113,133,.12);color:#9f1239}
    .edge-window{position:absolute;z-index:11;pointer-events:none;background:#e9f5ff;border:2px solid #334155;border-radius:4px;display:grid;place-items:center;color:#0f172a;font-size:12px;font-weight:900}
    .edge-window.top{width:40%;height:10px;top:-5px;left:30%}.edge-window.bottom{width:40%;height:10px;bottom:-5px;left:30%}.edge-window.left{height:40%;width:10px;left:-5px;top:30%}.edge-window.right{height:40%;width:10px;right:-5px;top:30%}
    .victim-result{margin:0 10px 8px;padding:10px 12px;border-radius:13px;border:1px solid var(--ok);background:rgba(52,211,153,.08);font-size:13px;line-height:1.35}

    .bottom{position:sticky;bottom:0;z-index:35;background:rgba(13,18,34,.97);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:8px 8px calc(8px + var(--safeBottom))}
    .active-strip{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:7px}
    .active-strip::-webkit-scrollbar{display:none}
    .person-chip,.object-chip,.room-chip{flex:none;min-height:42px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:7px;font-size:13px;font-weight:850}
    .person-chip.active,.object-chip.active,.room-chip.active{outline:2px solid var(--accent);border-color:transparent;background:#24204a}
    .person-dot{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:1000;text-shadow:0 1px 2px rgba(0,0,0,.4)}
    .tool-row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
    .tool{min-width:0;min-height:50px;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:5px 2px;color:var(--muted);font-size:10px;font-weight:900;display:grid;place-items:center;line-height:1.05}
    .tool span{display:block;font-size:20px;margin-bottom:2px;color:var(--text)}
    .tool.active{border-color:var(--accent);background:rgba(139,92,246,.2);color:#fff}

    .backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.18s}
    .backdrop.open{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:min(82dvh,760px);background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(105%);transition:.22s ease;overflow:hidden;padding-bottom:var(--safeBottom);box-shadow:0 -20px 50px rgba(0,0,0,.38)}
    .sheet.open{transform:translateY(0)}
    .sheet-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
    .sheet-head h2{font-size:17px;margin:0;flex:1}.sheet-body{padding:14px;overflow:auto;max-height:calc(min(82dvh,760px) - 64px);-webkit-overflow-scrolling:touch}
    .drag{width:44px;height:5px;border-radius:99px;background:#52617c;position:absolute;top:6px;left:50%;transform:translateX(-50%)}
    .close{width:40px;height:40px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;font-weight:900}
    .section{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px}
    .section h3{margin:0 0 10px;font-size:14px}
    .field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:var(--muted);font-weight:800}
    .field input,.field textarea,.field select{width:100%;min-height:44px;border:1px solid var(--line);background:#0e1526;color:var(--text);border-radius:11px;padding:10px 11px;outline:none}
    .field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
    .btn{min-height:44px;border:1px solid var(--line);background:var(--panel2);border-radius:11px;padding:9px 11px;font-weight:850}
    .btn.primary{background:var(--accent);border-color:var(--accent)}.btn.danger{background:#3b1d29;border-color:#713344;color:#ffdbe2}.btn.full{width:100%}
    .list{display:grid;gap:8px}.list-row{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);background:#0e1526;border-radius:12px;padding:8px}
    .list-row strong{display:block;font-size:13px}.list-row small{color:var(--muted)}
    .list-row .actions{display:flex;gap:5px}.tiny{width:38px;height:38px;border:1px solid var(--line);background:var(--panel2);border-radius:10px}
    .toggle{display:flex;align-items:flex-start;gap:9px;font-size:13px;line-height:1.35;margin:9px 0}.toggle input{width:20px;height:20px;accent-color:var(--accent);flex:none}
    .palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.palette button{min-height:54px;border:1px solid var(--line);background:#0e1526;border-radius:12px;font-size:22px}.palette button.active{outline:2px solid var(--accent)}
    .edge-grid{display:grid;grid-template-areas:"x top x2" "left mid right" "x3 bottom x4";grid-template-columns:1fr 1fr 1fr;gap:7px;max-width:230px;margin:auto}.edge-grid button{min-height:48px;border:1px solid var(--line);background:#0e1526;border-radius:11px;font-weight:900}.edge-grid .top{grid-area:top}.edge-grid .left{grid-area:left}.edge-grid .mid{grid-area:mid;background:var(--cell);color:var(--cellText)}.edge-grid .right{grid-area:right}.edge-grid .bottom{grid-area:bottom}
    .toast{position:fixed;z-index:100;left:12px;right:12px;bottom:calc(92px + var(--safeBottom));padding:11px 13px;border-radius:13px;background:#07101f;border:1px solid #4a5c7e;color:#fff;box-shadow:0 14px 35px rgba(0,0,0,.4);opacity:0;transform:translateY(12px);pointer-events:none;transition:.18s;text-align:center;font-size:13px}.toast.show{opacity:1;transform:none}
    .hint{font-size:12px;color:var(--muted);line-height:1.45}.danger-text{color:#fecdd3}.ok-text{color:#a7f3d0}
    .help-list{padding-left:20px;color:#dbe5f8;font-size:13px;line-height:1.5}.help-list li{margin-bottom:7px}

    @media(min-width:760px){
      .app{max-width:1100px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
      .topbar{padding-top:10px}.board-wrap{padding:20px}.sheet{left:50%;right:auto;width:min(620px,94vw);transform:translate(-50%,105%);border-radius:22px 22px 0 0}.sheet.open{transform:translate(-50%,0)}
    }
    @media print{.topbar,.statusbar,.bottom,.victim-result{display:none!important}.app{display:block}.main{overflow:visible}.board-wrap{overflow:visible;padding:0}.board-shell{box-shadow:none;margin:auto}.cell{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style>
</head>
<body>
<div id="bootBlocker"><div><strong>Uruchamianie Murdoku…</strong>Jeśli ten ekran nie zniknie po chwili, podgląd blokuje JavaScript. Pobierz plik i otwórz go w Safari.</div></div>

<div class="app" id="app">
  <header class="topbar">
    <div class="toprow">
      <div class="brand">MUR<b>DOKU</b></div>
      <input class="title" id="titleInput" value="Moja zagadka" aria-label="Nazwa zagadki">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    </div>
    <div class="mode-switch">
      <button id="buildModeBtn" class="active">🛠 Budowa</button>
      <button id="playModeBtn">🎮 Gra</button>
    </div>
  </header>

  <main class="main">
    <div class="statusbar">
      <div class="chip">Tryb: <strong id="modeStatus">budowa</strong></div>
      <div class="chip">Pole: <strong id="cellStatus">—</strong></div>
      <div class="chip">Finalne: <strong id="finalStatus">0</strong></div>
      <div class="chip bad" id="conflictStatus" hidden>⚠ konflikt</div>
      <button class="chip" id="fitBoardBtn">Dopasuj</button>
    </div>
    <div class="victim-result" id="murdererBox" hidden></div>
    <div class="board-wrap" id="boardWrap">
      <div class="board-shell" id="boardShell"><div class="board" id="board"></div></div>
    </div>
  </main>

  <footer class="bottom">
    <div class="active-strip" id="activeStrip"></div>
    <div class="tool-row" id="buildTools">
      <button class="tool active" data-tool="select"><span>☝️</span>Pole</button>
      <button class="tool" data-tool="room"><span>🚪</span>Pokój</button>
      <button class="tool" data-tool="object"><span>🛋️</span>Przedmiot</button>
      <button class="tool" data-tool="window"><span>🪟</span>Okno</button>
      <button class="tool" data-tool="block"><span>▧</span>Blokada</button>
    </div>
    <div class="tool-row" id="playTools" hidden>
      <button class="tool active" data-tool="candidate"><span>✎</span>Możliwe</button>
      <button class="tool" data-tool="x"><span>✕</span>Wyklucz</button>
      <button class="tool" data-tool="final"><span>●</span>Finalnie</button>
      <button class="tool" data-tool="inspect"><span>☝️</span>Podgląd</button>
      <button class="tool" id="victimCellBtn"><span>☠️</span>Ofiara</button>
    </div>
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="drag"></div>
  <div class="sheet-head"><h2 id="sheetTitle">Panel</h2><button class="close" id="closeSheetBtn" aria-label="Zamknij">✕</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>
<input id="importInput" type="file" accept="application/json,.json" hidden>

<script>
(function(){
  'use strict';
  const STORAGE='murdoku-mobile-v5';
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const uid=(p='id')=>p+'_'+Math.random().toString(36).slice(2,10);
  const clone=o=>JSON.parse(JSON.stringify(o));
  const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
  const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));

  const DEFAULT_OBJECTS=[
    {id:'chair',name:'Fotel / krzesło',symbol:'🪑',occupiable:true,edge:false,builtin:true},
    {id:'carpet',name:'Dywan',symbol:'▧',occupiable:true,edge:false,builtin:true},
    {id:'bed',name:'Łóżko',symbol:'🛏️',occupiable:true,edge:false,builtin:true},
    {id:'table',name:'Stół',symbol:'🪵',occupiable:false,edge:false,builtin:true},
    {id:'tv',name:'Telewizor',symbol:'📺',occupiable:false,edge:false,builtin:true},
    {id:'plant',name:'Roślina',symbol:'🪴',occupiable:false,edge:false,builtin:true},
    {id:'bookcase',name:'Regał',symbol:'📚',occupiable:false,edge:false,builtin:true},
    {id:'box',name:'Pudło',symbol:'📦',occupiable:false,edge:false,builtin:true},
    {id:'window',name:'Okno',symbol:'🪟',occupiable:false,edge:true,builtin:true}
  ];
  const DEFAULT_ROOMS=[{id:'room1',name:'Pokój 1',color:'#dbeafe'},{id:'room2',name:'Pokój 2',color:'#dcfce7'}];
  const DEFAULT_PEOPLE=[
    {id:'p1',name:'Podejrzany A',code:'A',color:'#ef4444',victim:false},
    {id:'p2',name:'Podejrzany B',code:'B',color:'#3b82f6',victim:false},
    {id:'p3',name:'Podejrzany C',code:'C',color:'#10b981',victim:false},
    {id:'victim',name:'Ofiara',code:'O',color:'#64748b',victim:true}
  ];
  const makeCell=()=>({roomId:null,blocked:false,objects:[],windows:[],note:'',marks:{},final:null,excluded:false});
  const makeState=()=>({version:9,title:'Moja zagadka',rows:4,cols:4,mode:'build',buildTool:'select',playTool:'candidate',clearMode:false,activeObjectId:'chair',activeRoomId:'room1',activePersonId:'p1',selected:null,objects:clone(DEFAULT_OBJECTS),rooms:clone(DEFAULT_ROOMS),people:clone(DEFAULT_PEOPLE),cells:Array.from({length:16},makeCell),rules:{autoX:true,uniqueRowsCols:true,uniquePeople:true,forbidEquipment:true},clues:''});

  let state=load()||makeState();
  let history=[],future=[],toastTimer=null,saveTimer=null;
  normalize();

  const el={
    app:$('#app'),title:$('#titleInput'),buildMode:$('#buildModeBtn'),playMode:$('#playModeBtn'),modeStatus:$('#modeStatus'),cellStatus:$('#cellStatus'),finalStatus:$('#finalStatus'),conflictStatus:$('#conflictStatus'),murdererBox:$('#murdererBox'),board:$('#board'),boardWrap:$('#boardWrap'),boardShell:$('#boardShell'),activeStrip:$('#activeStrip'),buildTools:$('#buildTools'),playTools:$('#playTools'),menu:$('#menuBtn'),fitBoard:$('#fitBoardBtn'),backdrop:$('#backdrop'),sheet:$('#sheet'),sheetTitle:$('#sheetTitle'),sheetBody:$('#sheetBody'),closeSheet:$('#closeSheetBtn'),toast:$('#toast'),importInput:$('#importInput'),victimCell:$('#victimCellBtn')
  };

  function load(){try{const raw=localStorage.getItem(STORAGE);return raw?JSON.parse(raw):null}catch(e){return null}}
  function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch(e){}},120)}
  function normalize(){
    const d=makeState();state=Object.assign(d,state||{});state.version=9;state.rows=clamp(Number(state.rows)||4,2,16);state.cols=clamp(Number(state.cols)||4,2,16);state.clearMode=!!state.clearMode;
    state.objects=Array.isArray(state.objects)?state.objects:d.objects;state.rooms=Array.isArray(state.rooms)?state.rooms:d.rooms;state.people=Array.isArray(state.people)?state.people:d.people;state.rules=Object.assign({},d.rules,state.rules||{});
    if(!state.people.some(p=>p.victim))state.people.push(clone(DEFAULT_PEOPLE[3]));

  function splitLabelIntoTwoLines(text,ctx,maxWidth){

  function roomLabelsData(){

      const component=[],queue=[start];seen.add(start);
      while(queue.length){
        const current=queue.shift(),p=rc(current);component.push(current);

      const rows=new Map();

        }
      });
      if(!runs.length)continue;

      const metrics=labelMetrics(room.name),horizontalPadding=18;
      const minimumRun=runs.some(run=>run.len>=2)?2:1;

      const textCapacity=run=>Math.max(4,run.len*metrics.cellSize-8-horizontalPadding);
      const oneLineRuns=usableRuns.filter(run=>metrics.width<=textCapacity(run));
      let chosen,twoLines=false;

      if(oneLineRuns.length){
        oneLineRuns.sort((a,b)=>b.row-a.row||b.end-a.end||a.len-b.len);
        chosen=oneLineRuns[0];
      }else{
        usableRuns.sort((a,b)=>b.len-a.len||b.row-a.row||b.end-a.end);
        chosen=usableRuns[0]||runs.sort((a,b)=>b.row-a.row||b.end-a.end)[0];

      const maxLabelWidth=Math.max(12,chosen.len*metrics.cellSize-8);

      });
    }
    return labels;
  }

  function menuSheet(){openSheet('Menu',`
    <div class="section"><div class="grid2"><button class="btn" id="undoBtn">↶ Cofnij</button><button class="btn" id="redoBtn">↷ Ponów</button></div></div>
    <div class="section"><h3>Projekt</h3><div class="grid2"><button class="btn" id="setupBtn">⚙️ Plansza</button><button class="btn" id="peopleBtn">👤 Osoby</button><button class="btn" id="roomsBtn">🚪 Pokoje</button><button class="btn" id="objectsBtn">🛋️ Przedmioty</button></div></div>
    <div class="section"><h3>Zapis</h3><div class="grid2"><button class="btn" id="exportBtn">⬇ Eksport JSON</button><button class="btn" id="importBtn">⬆ Import JSON</button></div><button class="btn full" id="printBtn" style="margin-top:8px">🖨 Drukuj</button></div>
    <div class="section"><h3>Gra</h3><button class="btn full" id="rulesBtn">⚙️ Reguły i opis zagadki</button><button class="btn full" id="lastVictimBtn" style="margin-top:8px">☠️ Ustal ofiarę na ostatnim wolnym polu</button><button class="btn danger full" id="clearGameBtn" style="margin-top:8px">Wyczyść oznaczenia gry</button></div>
    <button class="btn full" id="helpBtn">❔ Jak używać</button>`);
    $('#undoBtn').onclick=()=>{undo();closeSheet()};$('#redoBtn').onclick=()=>{redo();closeSheet()};$('#setupBtn').onclick=setupSheet;$('#peopleBtn').onclick=peopleSheet;$('#roomsBtn').onclick=roomsSheet;$('#objectsBtn').onclick=objectsSheet;$('#rulesBtn').onclick=rulesSheet;$('#helpBtn').onclick=helpSheet;$('#printBtn').onclick=()=>window.print();$('#importBtn').onclick=()=>el.importInput.click();$('#exportBtn').onclick=exportProject;$('#lastVictimBtn').onclick=placeVictimLast;$('#clearGameBtn').onclick=()=>{change(()=>state.cells.forEach(c=>{c.final=null;c.marks={};c.excluded=false}));closeSheet();toast('Oznaczenia gry usunięte.')};
  }
  function setupSheet(){openSheet('Plansza i reset',`<div class="section"><div class="grid2"><div class="field"><label>Wiersze</label><input id="rows" type="number" min="2" max="16" value="${state.rows}"></div><div class="field"><label>Kolumny</label><input id="cols" type="number" min="2" max="16" value="${state.cols}"></div></div><button class="btn primary full" id="resize">Zastosuj rozmiar</button><p class="hint">Istniejące pola pozostaną tam, gdzie to możliwe.</p></div><div class="section"><h3>Reset mapy</h3><button class="btn danger full" id="resetMap">🧹 Wyczyść całą mapę</button><p class="hint">Usuwa pokoje, przedmioty, okna, blokady i oznaczenia ze wszystkich pól. Zachowuje rozmiar, listę osób, pokojów i przedmiotów.</p></div><button class="btn danger full" id="newProject">Nowy pusty projekt</button>`);
    $('#resize').onclick=()=>{const nr=clamp(Number($('#rows').value)||state.rows,2,16),nc=clamp(Number($('#cols').value)||state.cols,2,16);change(()=>resize(nr,nc));closeSheet();toast('Rozmiar zmieniony.')};$('#resetMap').onclick=resetMapConfirmSheet;$('#newProject').onclick=newProjectConfirmSheet;
  }
  function resetMapConfirmSheet(){openSheet('Wyczyścić całą mapę?',`<div class="section"><p style="margin-top:0">Wszystkie pola wrócą do stanu początkowego. Tej operacji możesz użyć, gdy chcesz zbudować mapę od nowa bez usuwania osób, pokojów i przedmiotów.</p><p class="danger-text"><strong>Mapa zostanie wyczyszczona.</strong></p></div><div class="grid2"><button class="btn" id="cancelResetMap">Anuluj</button><button class="btn danger" id="confirmResetMap">Wyczyść mapę</button></div>`);$('#cancelResetMap').onclick=setupSheet;$('#confirmResetMap').onclick=()=>{change(()=>{state.cells=Array.from({length:state.rows*state.cols},makeCell);state.selected=null;state.clearMode=false;state.mode='build'});closeSheet();toast('Cała mapa została wyczyszczona.')}}
  function newProjectConfirmSheet(){openSheet('Nowy pusty projekt?',`<div class="section"><p style="margin-top:0">To usunie także własne osoby, pokoje, przedmioty i opis wskazówek.</p><p class="danger-text"><strong>Cały projekt zostanie zastąpiony.</strong></p></div><div class="grid2"><button class="btn" id="cancelNewProject">Anuluj</button><button class="btn danger" id="confirmNewProject">Utwórz nowy</button></div>`);$('#cancelNewProject').onclick=setupSheet;$('#confirmNewProject').onclick=()=>{state=makeState();history=[];future=[];renderAll();saveSoon();closeSheet();toast('Utworzono nowy projekt.')}}
  function resize(nr,nc){const old=state.cells,or=state.rows,oc=state.cols,next=Array.from({length:nr*nc},makeCell);for(let r=0;r<Math.min(or,nr);r++)for(let c=0;c<Math.min(oc,nc);c++)next[r*nc+c]=old[r*oc+c];state.rows=nr;state.cols=nc;state.cells=next;state.selected=null}
  function peopleSheet(){openSheet('Osoby',`<div class="list">${state.people.map(p=>`<div class="list-row"><span class="person-dot" style="background:${esc(p.color)}">${esc(p.code)}</span><div><strong>${esc(p.name)}</strong><small>${p.victim?'Ofiara':'Podejrzany'}</small></div><div class="actions"><button class="tiny" data-edit-person="${p.id}">✏️</button>${p.victim?'':`<button class="tiny" data-del-person="${p.id}">🗑</button>`}</div></div>`).join('')}</div><button class="btn primary full" id="addPerson" style="margin-top:10px">＋ Dodaj podejrzanego</button>`);$$('[data-edit-person]',el.sheetBody).forEach(b=>b.onclick=()=>personForm(b.dataset.editPerson));$$('[data-del-person]',el.sheetBody).forEach(b=>b.onclick=()=>{const id=b.dataset.delPerson;change(()=>{state.people=state.people.filter(p=>p.id!==id);state.cells.forEach(c=>{delete c.marks[id];if(c.final===id)c.final=null})});peopleSheet()});$('#addPerson').onclick=()=>personForm(null)}
  function personForm(id){const p=id?getPerson(id):{name:'',code:'',color:'#8b5cf6',victim:false};openSheet(id?'Edytuj osobę':'Nowy podejrzany',`<div class="field"><label>Nazwa</label><input id="personName" value="${esc(p.name)}" placeholder="Np. Austin"></div><div class="grid2"><div class="field"><label>Kod</label><input id="personCode" value="${esc(p.code)}" maxlength="3" placeholder="A"></div><div class="field"><label>Kolor</label><input id="personColor" type="color" value="${esc(p.color)}"></div></div><button class="btn primary full" id="savePerson">Zapisz</button>`);$('#savePerson').onclick=()=>{const name=$('#personName').value.trim(),code=$('#personCode').value.trim().slice(0,3);if(!name||!code){toast('Podaj nazwę i kod.');return}change(()=>{if(id)Object.assign(getPerson(id),{name,code,color:$('#personColor').value});else{const n={id:uid('person'),name,code,color:$('#personColor').value,victim:false};state.people.splice(Math.max(0,state.people.length-1),0,n);state.activePersonId=n.id}});peopleSheet()}}
  function roomsSheet(){openSheet('Pokoje',`<div class="list">${state.rooms.map(r=>`<div class="list-row"><span style="width:34px;height:34px;border-radius:9px;background:${esc(r.color)}"></span><div><strong>${esc(r.name)}</strong><small>Dotknij narzędzia „Pokój”, aby malować pola</small></div><div class="actions"><button class="tiny" data-edit-room="${r.id}">✏️</button><button class="tiny" data-del-room="${r.id}">🗑</button></div></div>`).join('')}</div><button class="btn primary full" id="addRoom" style="margin-top:10px">＋ Dodaj pokój</button>`);$$('[data-edit-room]',el.sheetBody).forEach(b=>b.onclick=()=>roomForm(b.dataset.editRoom));$$('[data-del-room]',el.sheetBody).forEach(b=>b.onclick=()=>{const id=b.dataset.delRoom;change(()=>{state.rooms=state.rooms.filter(r=>r.id!==id);state.cells.forEach(c=>{if(c.roomId===id)c.roomId=null})});roomsSheet()});$('#addRoom').onclick=()=>roomForm(null)}
  function roomForm(id){const r=id?getRoom(id):{name:'',color:'#fef3c7'};openSheet(id?'Edytuj pokój':'Nowy pokój',`<div class="field"><label>Nazwa</label><input id="roomName" value="${esc(r.name)}" placeholder="Np. Salon"></div><div class="field"><label>Kolor pól</label><input id="roomColor" type="color" value="${esc(r.color)}"></div><button class="btn primary full" id="saveRoom">Zapisz</button>`);$('#saveRoom').onclick=()=>{const name=$('#roomName').value.trim();if(!name){toast('Podaj nazwę pokoju.');return}change(()=>{if(id)Object.assign(getRoom(id),{name,color:$('#roomColor').value});else{const n={id:uid('room'),name,color:$('#roomColor').value};state.rooms.push(n);state.activeRoomId=n.id}});roomsSheet()}}
  function objectsSheet(){openSheet('Przedmioty',`<p class="hint"><span class="ok-text">Dozwolone:</span> fotel/krzesło, dywan, łóżko. <span class="danger-text">Niedozwolone:</span> stół, telewizor, roślina, regał i pudło. Okno ustawia się na krawędzi.</p><div class="list">${state.objects.map(o=>`<div class="list-row"><span style="font-size:32px;display:grid;place-items:center;width:40px;height:40px">${objectIcon(o)}</span><div><strong>${esc(o.name)}</strong><small>${o.edge?'Obiekt krawędziowy':o.occupiable?'Może być zajęty':'Nie może być zajęty'}</small></div><div class="actions">${o.builtin?'':`<button class="tiny" data-edit-object="${o.id}">✏️</button><button class="tiny" data-del-object="${o.id}">🗑</button>`}</div></div>`).join('')}</div><button class="btn primary full" id="addObject" style="margin-top:10px">＋ Dodaj własny przedmiot</button>`);$$('[data-edit-object]',el.sheetBody).forEach(b=>b.onclick=()=>objectForm(b.dataset.editObject));$$('[data-del-object]',el.sheetBody).forEach(b=>b.onclick=()=>{const id=b.dataset.delObject;change(()=>{state.objects=state.objects.filter(o=>o.id!==id);state.cells.forEach(c=>c.objects=c.objects.filter(x=>x!==id))});objectsSheet()});$('#addObject').onclick=()=>objectForm(null)}
  function objectForm(id){const o=id?getObj(id):{name:'',symbol:'◆',occupiable:true};openSheet(id?'Edytuj przedmiot':'Nowy przedmiot',`<div class="field"><label>Nazwa</label><input id="objName" value="${esc(o.name)}"></div><div class="field"><label>Emoji lub krótki symbol</label><input id="objSymbol" value="${esc(o.symbol)}" maxlength="4"></div><label class="toggle"><input id="objOcc" type="checkbox" ${o.occupiable?'checked':''}><span>Osoba może zajmować pole z tym przedmiotem</span></label><button class="btn primary full" id="saveObject">Zapisz</button>`);$('#saveObject').onclick=()=>{const name=$('#objName').value.trim(),symbol=$('#objSymbol').value.trim();if(!name||!symbol){toast('Podaj nazwę i symbol.');return}change(()=>{if(id)Object.assign(getObj(id),{name,symbol,occupiable:$('#objOcc').checked});else{const n={id:uid('obj'),name,symbol,occupiable:$('#objOcc').checked,edge:false,builtin:false};state.objects.push(n);state.activeObjectId=n.id}});objectsSheet()}}
  function rulesSheet(){openSheet('Reguły i wskazówki',`<div class="section"><label class="toggle"><input id="autoX" type="checkbox" ${state.rules.autoX?'checked':''}><span>Pokazuj automatyczne X</span></label><label class="toggle"><input id="rowsCols" type="checkbox" ${state.rules.uniqueRowsCols?'checked':''}><span>Każda osoba w innym wierszu i kolumnie</span></label><label class="toggle"><input id="uniquePeople" type="checkbox" ${state.rules.uniquePeople?'checked':''}><span>Każda osoba tylko raz na planszy</span></label><label class="toggle"><input id="equip" type="checkbox" ${state.rules.forbidEquipment?'checked':''}><span>Blokuj stół, TV, roślinę, regał i pudło</span></label></div><div class="field"><label>Opis wskazówek z książki</label><textarea id="clues" placeholder="Przepisz wskazówki…">${esc(state.clues)}</textarea></div><button class="btn primary full" id="saveRules">Zapisz</button>`);$('#saveRules').onclick=()=>{change(()=>{state.rules.autoX=$('#autoX').checked;state.rules.uniqueRowsCols=$('#rowsCols').checked;state.rules.uniquePeople=$('#uniquePeople').checked;state.rules.forbidEquipment=$('#equip').checked;state.clues=$('#clues').value});closeSheet()}}
  function helpSheet(){openSheet('Jak grać na telefonie',`<ol class="help-list"><li>W <strong>Budowie</strong> ustaw rozmiar z menu, dodaj pokoje, osoby i przedmioty.</li><li>Wybierz narzędzie na dole. Nad narzędziami pojawią się pokoje, przedmioty albo osoby.</li><li>Opcja <strong>Czyść</strong> resetuje każde dotknięte pole wraz z pokojem, przedmiotami, oknami i oznaczeniami.</li><li>W <strong>Grze</strong> „Możliwe” wpisuje kod osoby, „Wyklucz” stawia jedno duże X na całym polu, a „Finalnie” ustawia osobę.</li><li>Po finalnym ustawieniu pola w tym samym wierszu i kolumnie dostają automatyczne X. Niedozwolone wyposażenie pozostaje widoczne bez X, ale nie można na nim ustawić osoby.</li><li>Ofiarę możesz ustawić ręcznie albo przez menu na ostatnim wolnym przecięciu wiersza i kolumny.</li><li>„Obok” oznacza bezpośrednio górę, dół, lewo lub prawo oraz ten sam pokój.</li></ol><p class="hint">Projekt zapisuje się lokalnie. Do kopii zapasowej użyj eksportu JSON.</p>`)}

  function placeVictimLast(){
    const victim=state.people.find(p=>p.victim);if(!victim){toast('Brak ofiary.');return}const usedR=new Set(),usedC=new Set();state.cells.forEach((c,i)=>{if(c.final){const p=rc(i);usedR.add(p.r);usedC.add(p.c)}});const freeR=[];for(let r=0;r<state.rows;r++)if(!usedR.has(r))freeR.push(r);const freeC=[];for(let c=0;c<state.cols;c++)if(!usedC.has(c))freeC.push(c);if(freeR.length!==1||freeC.length!==1){toast('Musi pozostać dokładnie jeden wolny wiersz i jedna kolumna.');return}const i=idx(freeR[0],freeC[0]),reason=constraintReason(i,victim.id);if(reason&&state.cells[i].final!==victim.id){toast(reason);return}change(()=>state.cells[i].final=victim.id);closeSheet();toast('Ofiara ustawiona na ostatnim wolnym polu.')
  }
  async function exportProject(){
    const data=JSON.stringify(state,null,2),name=(state.title.trim()||'murdoku').replace(/[^a-zA-Z0-9ąćęłńóśźżĄĆĘŁŃÓŚŹŻ_-]+/g,'_')+'.json';
    try{const file=new File([data],name,{type:'application/json'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({title:state.title,files:[file]});return}}catch(e){}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Eksport przygotowany.')
  }

  el.board.addEventListener('click',e=>{const b=e.target.closest('.cell');if(b)cellTap(Number(b.dataset.index))});
  el.buildMode.onclick=()=>{state.mode='build';renderAll();saveSoon()};el.playMode.onclick=()=>{state.mode='play';state.clearMode=false;renderAll();saveSoon()};
  el.buildTools.addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;state.buildTool=b.dataset.tool;state.clearMode=false;renderAll();saveSoon()});
  el.playTools.addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;state.playTool=b.dataset.tool;renderAll();saveSoon()});
  el.activeStrip.addEventListener('click',e=>{const r=e.target.closest('[data-room]'),o=e.target.closest('[data-object]'),p=e.target.closest('[data-person]'),a=e.target.closest('[data-action]');if(r){state.activeRoomId=r.dataset.room;state.clearMode=false;renderStrip();saveSoon()}else if(o){state.activeObjectId=o.dataset.object;state.clearMode=false;renderStrip();saveSoon()}else if(p){state.activePersonId=p.dataset.person;renderAll();saveSoon()}else if(a){if(a.dataset.action==='clear-mode'){state.clearMode=!state.clearMode;renderAll();saveSoon();toast(state.clearMode?'Tryb czyszczenia: dotknij pola.':'Tryb czyszczenia wyłączony.');return}({rooms:roomsSheet,objects:objectsSheet,people:peopleSheet,setup:setupSheet,cell:()=>state.selected==null?toast('Najpierw wybierz pole.'):openCellSheet(state.selected)})[a.dataset.action]?.()}});
  el.menu.onclick=menuSheet;el.closeSheet.onclick=closeSheet;el.backdrop.onclick=closeSheet;el.fitBoard.onclick=()=>{fitCellSize();el.boardWrap.scrollTo({left:0,top:0,behavior:'smooth'})};
  el.title.addEventListener('input',e=>{state.title=e.target.value;saveSoon()});
  el.victimCell.onclick=()=>{const v=state.people.find(p=>p.victim);if(!v)return;state.activePersonId=v.id;state.playTool='final';renderAll();toast('Wybierz finalne pole ofiary.')};
  el.importInput.addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);snapshot();state=x;normalize();renderAll();saveSoon();closeSheet();toast('Projekt zaimportowany.')}catch(err){toast('Niepoprawny plik projektu.')}};reader.readAsText(f);e.target.value=''});
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}});
  window.addEventListener('resize',()=>{fitCellSize()});

  renderAll();saveSoon();requestAnimationFrame(()=>$('#bootBlocker').remove());
})();
</script>
</body>
</html>
