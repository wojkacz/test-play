name: Apply Murdoku v18 collapsible controls history

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v18 collapsible controls history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and verify v18 patch
        run: |
          test "$(git hash-object index.html)" = "63625a9d35c49f1c9f8ef962a2e69ed236495bba"
          echo "23cda5fa3ab3233d855493a03e32528843809c3c851db3c329b427765d36a92e  .patches/v18/part-00" | sha256sum -c -
          echo "5ca99e74756c30ba7a771d8ebf2b9b5b547753047b4bdfb0aefaef01af1c3388  .patches/v18/part-01" | sha256sum -c -
          echo "126dd39f3c64319d9efc1be2dadc90fed988f28cbe1c71cda2a311621058284f  .patches/v18/part-02" | sha256sum -c -
          echo "826d5a116c56d214c707701053f1607610e3061f844dcfdca2e1767a382dc9e9  .patches/v18/part-03" | sha256sum -c -
          cat .patches/v18/part-* | base64 -d | gzip -d > /tmp/murdoku-v18.patch
          git apply --check /tmp/murdoku-v18.patch
          git apply /tmp/murdoku-v18.patch
          test "$(git hash-object index.html)" = "d6495a85a7cd28051ce22c670383cf91cc940324"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'version:18' in html,
            'state.version=18' in html,
            'id="controlsToggleBtn"' in html,
            "controlsCollapsed:false" in html,
            ".app.controls-collapsed .mode-switch" in html,
            'id="statusCloseBtn"' in html,
            "dismissedWarningKey=key" in html,
            'id="historyPanel"' in html,
            'id="historyToggleBtn"' in html,
            'function describeStateChange(before,after)' in html,
            'function renderHistory()' in html,
            'Do cofnięcia' in html,
            'Do ponowienia' in html,
            "['window','block'].includes(state.buildTool)" in html,
            'class="object-chip strip-grow' in html,
            "snapshot(gesture.tool==='candidate'" in html,
          ]
          if not all(checks): raise SystemExit('Static validation failed')
          script=re.search(r'<script>\s*(.*?)\s*</script>',html,re.S)
          if not script: raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v18.js').write_text(script.group(1),encoding='utf-8')
          PY
          node --check /tmp/murdoku-v18.js
      - name: Remove temporary patch tooling
        run: rm -rf .patches .github/workflows/apply-v18-collapsible-controls-history.yml
      - name: Commit only final index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add collapsible controls and action history"
          git push origin HEAD:${{ github.head_ref }}
