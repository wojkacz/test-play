name: Apply Murdoku v14 window focus history

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v14 window focus history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and verify v14 patch
        run: |
          echo "79cde365315be201f974df2ac5a808c38335f59292dcf5d54ac05743ab2b4c23  .patches/v14/part-00" | sha256sum -c -
          echo "abe5c8096b6d6ec3f4f1c95ad24e7464735c082c02180b69065093864a3a24c9  .patches/v14/part-01" | sha256sum -c -
          echo "408766abb93cdb23da6fb2bc78bf084deed7ab75610688712a2cfda6e80ba8cd  .patches/v14/part-02" | sha256sum -c -
          cat .patches/v14/part-* | base64 -d | gzip -d > /tmp/murdoku-v14.patch
          git apply --check /tmp/murdoku-v14.patch
          git apply /tmp/murdoku-v14.patch
          test "$(git hash-object index.html)" = "1ed8b7ce4440f817418d9a5b8ad27e8246b3cd2a"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'version:14' in html,
              'state.version=14' in html,
              'function renderedWindows(i)' in html,
              "if(hasWindow(i,'top'))sides.push('top')" in html,
              "if(hasWindow(i,'left'))sides.push('left')" in html,
              'z-index:6;pointer-events:none;width:76%' in html,
              '.cell.person-focus::after' in html,
              '.final-token.person-match' in html,
              '.mark.person-match' in html,
              'id="playHistory"' in html,
              'id="playUndoBtn"' in html,
              'id="playRedoBtn"' in html,
              'el.playUndo.onclick=undo;el.playRedo.onclick=redo' in html,
              'font-size:calc(var(--cell-size) * .62)' in html,
          ]
          if not all(checks):
              raise SystemExit('Static validation failed')
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script:
              raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v14.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/murdoku-v14.js
      - name: Remove temporary patch tooling
        run: rm -rf .patches .github/workflows/apply-v14-window-focus-history.yml
      - name: Commit only index.html changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine shared windows and game controls"
          git push origin HEAD:${{ github.head_ref }}
