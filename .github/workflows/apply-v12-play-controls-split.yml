name: Apply Murdoku v12 split patch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v12 play controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply verified split patch
        run: |
          echo "6e7046f5bc314bbfa263e7ff47554743ca2d7193ec5f7e0d985cc5ab093c60df  .patches/v12/part-00" | sha256sum -c -
          echo "296ff6212df38a9aa22d52d56cd6d2a3c4beecc7df57d0cd183a57ecd081e8bb  .patches/v12/part-01" | sha256sum -c -
          echo "7907aba0b31c5f47176c1d3e18b50e39dc5c01a8dbd3564a73fa422347c8a671  .patches/v12/part-02" | sha256sum -c -
          cat .patches/v12/part-* | base64 -d | gzip -d > /tmp/murdoku-v12.patch
          git apply --check /tmp/murdoku-v12.patch
          git apply /tmp/murdoku-v12.patch
          test "$(git hash-object index.html)" = "2d99f8174a9317b48859145d0a35bf05192df577"
          grep -q '#playTools{grid-template-columns:repeat(4,1fr)}' index.html
          grep -q 'instruction-chip' index.html
          grep -q 'width:74%;height:12px' index.html
          ! grep -q 'victimCellBtn' index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script:
              raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v12.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/murdoku-v12.js
      - name: Commit clean result
        run: |
          rm -rf .patches .github/workflows/apply-v12-play-controls.yml .github/workflows/apply-v12-play-controls-split.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Murdoku play controls and windows"
          git push origin HEAD:${{ github.head_ref }}
