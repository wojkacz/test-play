name: Apply Murdoku v9 patch

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v9 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and verify v9 diff
        run: |
          base64 -d .patches/murdoku-v9.patch.gz.b64 | gzip -d > /tmp/murdoku-v9.patch
          git apply --check /tmp/murdoku-v9.patch
          git apply /tmp/murdoku-v9.patch
          test "$(git hash-object index.html)" = "d78a6a3ce77b248b95af161ec9f4af78f1e05943"
      - name: Remove temporary patch tooling
        run: rm -rf .patches .github/workflows/apply-v9.yml
      - name: Commit only index.html changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update index.html to Murdoku v9"
          git push origin HEAD:${{ github.head_ref }}
