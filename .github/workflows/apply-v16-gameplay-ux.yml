name: Apply Murdoku v16 gameplay UX

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v16 gameplay UX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and verify v16 patch
        run: |
          echo "be2c3ea8afc4058585b3921a534f432c831b14a1da6ffd4618a9db202eb5daa4  .patches/v16/part-00" | sha256sum -c -
          echo "e960e8060f175df427d2fe53c917543bb78793269a56b56d65069f97d9b8cb7b  .patches/v16/part-01" | sha256sum -c -
          echo "0fee147d65c474e512095ca3f92c541e859826e30f45245e44d84e175008b7cb  .patches/v16/part-02" | sha256sum -c -
          echo "14fa0b824c68d5a38cf33da60f978984f2d1ea4e32df91b730cee557a2efb2ca  .patches/v16/part-03" | sha256sum -c -
          echo "ad9cef55ecd19f14b947710574baebb0082c290582a1bb2479ab28c46d408db0  .patches/v16/part-04" | sha256sum -c -
          echo "9ed9eb493153b98f06cead84da8d1f2c5ed042962fd0c0b88280cc61e3caad1f  .patches/v16/part-05" | sha256sum -c -
          cat .patches/v16/part-* | base64 -d | gzip -d > /tmp/murdoku-v16.patch
          git apply --check /tmp/murdoku-v16.patch
          git apply /tmp/murdoku-v16.patch
          test "$(git hash-object index.html)" = "808f89db10c77a7f6be12e2243ae768c5e8dae4a"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'version:16' in html,
              'state.version=16' in html,
              'function openCellQuickSheet(i)' in html,
              'function fillRoomZone(start,roomId)' in html,
              'Wypełnij tę białą strefę' in html,
              'function quickReasonForCell(i)' in html,
              'function personStats(personId)' in html,
              'function candidateWarnings()' in html,
              'focusPersonId:null' in html,
              'class="person-count' in html,
              'id="zoomOutBtn"' in html,
              'id="zoomFitBtn"' in html,
              'id="zoomInBtn"' in html,
              "['candidate','x'].includes(g.tool)" in html,
              'function paintAt(i)' in html,
              "addEventListener('touchmove'" in html,
              'marked>0&&x.stats.available===0' in html,
              'history.push(JSON.stringify(state))' in html,
          ]
          if not all(checks):
              raise SystemExit('Static validation failed')
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script:
              raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v16.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/murdoku-v16.js
      - name: Remove temporary patch tooling
        run: rm -rf .patches .github/workflows/apply-v16-gameplay-ux.yml
      - name: Commit only index.html changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add gameplay shortcuts and focus tools"
          git push origin HEAD:${{ github.head_ref }}
