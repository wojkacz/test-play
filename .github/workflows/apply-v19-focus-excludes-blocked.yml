name: Apply Murdoku v19 focus exclusion fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v19 focus exclusion fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply focused-field exclusion fix
        run: |
          test "$(git hash-object index.html)" = "d6495a85a7cd28051ce22c670383cf91cc940324"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('index.html')
          text=path.read_text(encoding='utf-8')

          replacements={
            'Murdoku — mobilny kreator planszy v18':'Murdoku — mobilny kreator planszy v19',
            "version:18,title:'Moja zagadka'":"version:19,title:'Moja zagadka'",
            'state.version=18;':'state.version=19;',
            "const personFocused=!!activePerson&&((state.display.finals&&cell.final===activePerson)||(state.display.candidates&&cell.marks[activePerson]==='candidate'));":"const focusExcluded=cell.blocked||cell.excluded||!!autoCell||blockedByObject;\n      const personFocused=!!activePerson&&!focusExcluded&&((state.display.finals&&cell.final===activePerson)||(state.display.candidates&&cell.marks[activePerson]==='candidate'));"
          }
          for old,new in replacements.items():
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'Expected one match, found {count}: {old}')
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          script=re.search(r'<script>\s*(.*?)\s*</script>',text,re.S)
          if not script:
              raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v19.js').write_text(script.group(1),encoding='utf-8')
          required=[
            'version:19',
            'state.version=19',
            'const focusExcluded=cell.blocked||cell.excluded||!!autoCell||blockedByObject;',
            '!!activePerson&&!focusExcluded'
          ]
          if not all(item in text for item in required):
              raise SystemExit('Static validation failed')
          PY
          node --check /tmp/murdoku-v19.js
          node <<'JS'
          const focused=(active,blocked,excluded,auto,objectBlocked,finalMatch,candidateMatch)=>{
            const focusExcluded=blocked||excluded||!!auto||objectBlocked;
            return !!active&&!focusExcluded&&(finalMatch||candidateMatch);
          };
          if(!focused(true,false,false,false,false,false,true))throw new Error('Available candidate should stay highlighted');
          for(const flags of [[true,false,false,false],[false,true,false,false],[false,false,true,false],[false,false,false,true]]){
            if(focused(true,...flags,false,true))throw new Error('Excluded candidate must not be highlighted');
          }
          JS
          test "$(git hash-object index.html)" = "6d7511c4e6d0f8e50e76ad4e483aaf1839930d22"
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-v19-focus-excludes-blocked.yml
      - name: Commit final index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Skip excluded fields in person focus"
          git push origin HEAD:${{ github.head_ref }}
