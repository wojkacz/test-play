name: Install Murdoku v7

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  install:
    if: github.event.issue.title == 'Install Murdoku v7 now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build index.html
        run: cat .tmp-v7/chunk-* | base64 -d > index.html
      - name: Verify file
        run: test "$(git hash-object index.html)" = "bfd4ed7561da18a65a96374d64652b25189e37b1"
      - name: Remove staging files
        run: rm -rf .tmp-v7
      - name: Commit Murdoku v7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update index.html to Murdoku v7"
          git push
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}"
