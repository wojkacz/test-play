name: Apply room label width fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Fix Murdoku room label width'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and verify label patch
        run: |
          base64 -d .patches/murdoku-label-width.patch.gz.b64 | gzip -d > /tmp/murdoku-label-width.patch
          git apply --check /tmp/murdoku-label-width.patch
          git apply /tmp/murdoku-label-width.patch
          test "$(git hash-object index.html)" = "734e2bb4435a67d1815c00275d4e9bf7584e3b5b"
      - name: Remove temporary patch tooling
        run: rm -rf .patches .github/workflows/apply-label-width.yml
      - name: Commit only index.html changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Murdoku room label width"
          git push origin HEAD:${{ github.head_ref }}
