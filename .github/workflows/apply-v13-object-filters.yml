name: Apply Murdoku v13 object filters

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v13 object filters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and verify v13 patch
        run: |
          echo "7d0fa18c68840c1d3fe456a0000896a89300c2cfbb2729027ffad892e3fda2bb  .patches/v13/part-00" | sha256sum -c -
          echo "e94d40ef14ac62e5551e009d5af6c7d325bf0d6c36887fbc7fb00f91fd8c0e53  .patches/v13/part-01" | sha256sum -c -
          echo "b38bfcd4c7214c179f075df49993b7b5f0fcb90e7142fca1636102cc809b4cff  .patches/v13/part-02" | sha256sum -c -
          cat .patches/v13/part-* | base64 -d | gzip -d > /tmp/murdoku-v13.patch
          sed -i 's#a/mnt/data/murdoku_v12_working.html#a/index.html#g; s#b/mnt/data/murdoku_v13_working.html#b/index.html#g' /tmp/murdoku-v13.patch
          git apply --check /tmp/murdoku-v13.patch
          git apply /tmp/murdoku-v13.patch
          test "$(git hash-object index.html)" = "bc20b77803e931cd54ca60706622ad314a01ba55"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'version:13' in html,
              'state.version=13' in html,
              'EDGE_WINDOW_SVG' in html,
              'id="objectFilterBtn"' in html,
              'hiddenObjectIds:[]' in html,
              '!hiddenObjects.has(o.id)' in html,
              'source.objects.filter(id=>cellObjectIds.has(id))' in html,
              'function objectFilterSheet()' in html,
              'aria-hidden="true"></span>' not in html,
          ]
          if not all(checks):
              raise SystemExit('Static validation failed')
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script:
              raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v13.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/murdoku-v13.js
      - name: Remove temporary patch tooling
        run: rm -rf .patches .github/workflows/apply-v13-object-filters.yml
      - name: Commit only index.html changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix window rendering and add object filters"
          git push origin HEAD:${{ github.head_ref }}
