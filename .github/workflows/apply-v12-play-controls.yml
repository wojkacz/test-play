name: Apply Murdoku v12 play controls

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v12 play controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and verify v12 patch
        run: |
          echo "ecac7906620b90768519b3ba402dc00147d7613f21425561702eb5181130cf67  .patches/murdoku-v12.patch.gz.b64" | sha256sum -c -
          base64 -d .patches/murdoku-v12.patch.gz.b64 | gzip -d > /tmp/murdoku-v12.patch
          git apply --check /tmp/murdoku-v12.patch
          git apply /tmp/murdoku-v12.patch
          test "$(git hash-object index.html)" = "2d99f8174a9317b48859145d0a35bf05192df577"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert 'id="victimCellBtn"' not in html
          assert '#playTools{grid-template-columns:repeat(4,1fr)}' in html
          assert "state.playTool==='candidate')return people.filter(p=>!placed.has(p.id))" in html
          assert 'instruction-chip' in html and 'padding:3px 2px 9px' in html
          assert 'width:74%;height:12px' in html
          for rotation in ('rotate(180deg)', 'rotate(-90deg)', 'rotate(90deg)'):
              assert rotation in html
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script:
              raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v12.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/murdoku-v12.js
      - name: Remove temporary patch tooling
        run: rm -rf .patches .github/workflows/apply-v12-play-controls.yml
      - name: Commit only index.html changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Murdoku play controls and windows"
          git push origin HEAD:${{ github.head_ref }}
