name: Run Murdoku v17 transformation

on:
  push:
    branches:
      - agent/murdoku-v17-room-label-zone-removal

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/murdoku-v17-room-label-zone-removal
          fetch-depth: 0
      - name: Transform index.html
        run: |
          test "$(git hash-object index.html)" = "808f89db10c77a7f6be12e2243ae768c5e8dae4a"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once('align-items:flex-end;justify-content:flex-end;', 'align-items:center;justify-content:flex-end;')
          replace_once('font-size:var(--label-font-size,clamp(8px,calc(var(--cell-size) * .118),11px));', 'font-size:var(--label-font-size,clamp(6px,calc(var(--cell-size) * .095),16px));')
          replace_once('.room-label.one-line{white-space:nowrap;max-height:1.55em}', '.room-label.one-line{white-space:nowrap;height:calc(var(--label-font-size) * 1.55 + 6px)}')
          replace_once('.room-label.two-lines{white-space:normal;max-height:2.45em}', '.room-label.two-lines{white-space:normal;height:calc(var(--label-font-size) * 2.45 + 6px)}')
          replace_once('.quick-reason{padding:9px 10px;margin-bottom:10px;border-radius:11px;border:1px solid rgba(251,191,36,.42);background:rgba(251,191,36,.08);color:#fde68a;font-size:12px;line-height:1.4}\n    .toast', '.quick-reason{padding:9px 10px;margin-bottom:10px;border-radius:11px;border:1px solid rgba(251,191,36,.42);background:rgba(251,191,36,.08);color:#fde68a;font-size:12px;line-height:1.4}\n    .quick-action.danger{border-color:#713344;background:#3b1d29;color:#ffdbe2}\n    .toast')

          replace_once("version:16,title:'Moja zagadka'", "version:17,title:'Moja zagadka'")
          replace_once('state.version=16;', 'state.version=17;')
          replace_once('const fontSize=clamp(cellSize*.118,8,11);', 'const fontSize=clamp(cellSize*.095,6,16);')

          marker = "  function rc(i){return{r:Math.floor(i/state.cols),c:i%state.cols}}"
          helpers = """  function connectedCellZone(start,predicate){
    if(start<0||start>=state.cells.length||!predicate(state.cells[start],start))return[];
    const result=[],seen=new Set([start]),queue=[start],steps=[[1,0],[-1,0],[0,1],[0,-1]];
    while(queue.length){const current=queue.shift();result.push(current);const p=rc(current);steps.forEach(([dr,dc])=>{const r=p.r+dr,c=p.c+dc;if(r<0||c<0||r>=state.rows||c>=state.cols)return;const n=idx(r,c);if(!seen.has(n)&&predicate(state.cells[n],n)){seen.add(n);queue.push(n)}})}
    return result;
  }
  function removeRoomZone(start){
    const roomId=state.cells[start]?.roomId;if(!roomId)return[];const result=[];
    state.cells.forEach((cell,i)=>{if(cell.roomId!==roomId)return;result.push(i);cell.roomId=null;cell.objects=[]});
    return result;
  }
  function clearBlockedZone(start){
    const zone=connectedCellZone(start,cell=>!!cell.blocked);zone.forEach(i=>state.cells[i].blocked=false);return zone;
  }
"""
          replace_once(marker, helpers + marker)

          object_marker = "      if(state.buildTool==='object'&&state.activeObjectId){const obj=getObj(state.activeObjectId);actions.push(`<button class=\"quick-action\" id=\"quickObject\"><strong>${objectIcon(obj)} Przełącz: ${esc(obj?.name||'przedmiot')}</strong><small>Dodaje lub usuwa wybrany przedmiot z pola.</small></button>`)}"
          extra_actions = """      if(cell.roomId){const existingRoom=getRoom(cell.roomId),roomFields=state.cells.filter(c=>c.roomId===cell.roomId).length;actions.push(`<button class="quick-action danger" id="quickRemoveRoom"><strong>🗑 Usuń cały pokój: ${esc(existingRoom?.name||'bez nazwy')}</strong><small>Usunie ${roomFields} ${fieldWord(roomFields)} tego pokoju oraz wszystkie przedmioty znajdujące się na tych polach. Pokój pozostanie na liście i będzie można użyć go ponownie.</small></button>`)}
      if(cell.blocked){const blockedFields=connectedCellZone(i,c=>!!c.blocked).length;actions.push(`<button class="quick-action danger" id="quickRemoveBlocked"><strong>▧ Usuń całą strefę „Niedostępne”</strong><small>Odblokuje ${blockedFields} stykających się bokami ${fieldWord(blockedFields)}. Pokoje i przedmioty pozostaną bez zmian.</small></button>`)}
"""
          replace_once(object_marker, extra_actions + object_marker)

          handler_marker = "    const objectBtn=$('#quickObject');if(objectBtn)objectBtn.onclick=()=>{change(()=>{const k=cell.objects.indexOf(state.activeObjectId);if(k>=0)cell.objects.splice(k,1);else cell.objects.push(state.activeObjectId)});done()};"
          extra_handlers = """    const removeRoomBtn=$('#quickRemoveRoom');if(removeRoomBtn)removeRoomBtn.onclick=()=>{const roomName=getRoom(cell.roomId)?.name||'Pokój';let count=0;change(()=>{count=removeRoomZone(i).length});done(`Usunięto „${roomName}” z ${count} ${fieldWord(count)} wraz z przedmiotami.`)};
    const removeBlockedBtn=$('#quickRemoveBlocked');if(removeBlockedBtn)removeBlockedBtn.onclick=()=>{let count=0;change(()=>{count=clearBlockedZone(i).length});done(`Odblokowano ${count} ${fieldWord(count)} w połączonej strefie.`)};
"""
          replace_once(handler_marker, extra_handlers + handler_marker)

          replace_once('Przytrzymaj pole, aby otworzyć szybkie akcje. Przy narzędziu „Pokój” możesz w ten sposób wypełnić całą stykającą się białą strefę wybranym pokojem.', 'Przytrzymaj pole, aby otworzyć szybkie akcje. Przy narzędziu „Pokój” możesz wypełnić stykającą się białą strefę, usunąć cały pokój wraz z przedmiotami albo odblokować całą połączoną strefę „Niedostępne”.')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate JavaScript and zone behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          checks = [
              'version:17' in html,
              'state.version=17' in html,
              'align-items:center;justify-content:flex-end' in html,
              'calc(var(--cell-size) * .095)' in html,
              'const fontSize=clamp(cellSize*.095,6,16)' in html,
              'height:calc(var(--label-font-size) * 1.55 + 6px)' in html,
              'function connectedCellZone(start,predicate)' in html,
              'function removeRoomZone(start)' in html,
              'function clearBlockedZone(start)' in html,
              'id="quickRemoveRoom"' in html,
              'id="quickRemoveBlocked"' in html,
              'cell.roomId=null;cell.objects=[]' in html,
              'zone.forEach(i=>state.cells[i].blocked=false)' in html,
              "change(()=>{count=removeRoomZone(i).length})" in html,
              "change(()=>{count=clearBlockedZone(i).length})" in html,
          ]
          if not all(checks):
              raise SystemExit('Static validation failed')
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script:
              raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v17.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/murdoku-v17.js
          node <<'JS'
          const fs=require('fs');
          const js=fs.readFileSync('/tmp/murdoku-v17.js','utf8');
          const start=js.indexOf('function connectedCellZone');
          const end=js.indexOf('function rc',start);
          if(start<0||end<0)throw new Error('Zone helpers missing');
          const block=js.slice(start,end);
          let state={rows:3,cols:4,cells:Array.from({length:12},()=>({roomId:null,objects:[],blocked:false}))};
          function rc(i){return{r:Math.floor(i/state.cols),c:i%state.cols}}
          function idx(r,c){return r*state.cols+c}
          eval(block);
          [0,1,4,11].forEach((i,n)=>{state.cells[i].roomId='roomA';state.cells[i].objects=['obj'+n]});
          state.cells[7].roomId='roomB';state.cells[7].objects=['keep'];
          const removed=removeRoomZone(0);
          if(removed.length!==4||[0,1,4,11].some(i=>state.cells[i].roomId||state.cells[i].objects.length))throw new Error('Whole-room removal failed');
          if(state.cells[7].roomId!=='roomB'||state.cells[7].objects[0]!=='keep')throw new Error('Other room was modified');
          [1,2,5,11].forEach(i=>state.cells[i].blocked=true);
          const cleared=clearBlockedZone(1);
          if(cleared.length!==3||[1,2,5].some(i=>state.cells[i].blocked)||!state.cells[11].blocked)throw new Error('Connected blocked-zone removal failed');
          console.log('Zone behavior passed');
          JS
          echo "Final index.html blob: $(git hash-object index.html)"
      - name: Remove temporary files and commit
        run: |
          rm -f .github/workflows/apply-v17-room-label-zone-removal.yml .github/workflows/run-v17-on-push.yml .trigger-v17
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Scale room labels and remove build zones"
          git push origin HEAD:agent/murdoku-v17-room-label-zone-removal
