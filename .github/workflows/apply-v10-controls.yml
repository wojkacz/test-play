name: Apply Murdoku v10 controls

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.title == 'Apply Murdoku v10 controls'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply and verify controls patch
        run: |
          echo "8f4b321adbda637fd8f38cd5d9c7d670cb16143f6f4cbb128d6a6313409c1d6b  .patches/v10/part-00" | sha256sum -c -
          echo "7329d5cbbb6c3be18791534edce2b1b59bfe0d5664584c8ac3c34a9e0bc66d76  .patches/v10/part-01" | sha256sum -c -
          echo "5f9f6a612c336117da5de63295930367a226f56ef016f428e754206fb49a895f  .patches/v10/part-02" | sha256sum -c -
          cat .patches/v10/part-* | base64 -d | gzip -d > /tmp/murdoku-v10-controls.patch
          git apply --check /tmp/murdoku-v10-controls.patch
          git apply /tmp/murdoku-v10-controls.patch
          test "$(git hash-object index.html)" = "abb77b2a2fcb9f83a64a65a9a732002e26f222a6"
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          script = re.search(r'<script>\s*(.*?)\s*</script>', html, re.S)
          if not script:
              raise SystemExit('Missing script block')
          Path('/tmp/murdoku-v10.js').write_text(script.group(1), encoding='utf-8')
          PY
          node --check /tmp/murdoku-v10.js
      - name: Remove temporary patch tooling
        run: rm -rf .patches .github/workflows/apply-v10-controls.yml
      - name: Commit only index.html changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Murdoku controls and people management"
          git push origin HEAD:${{ github.head_ref }}
